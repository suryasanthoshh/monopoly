services:
  monopoly:
    build: .
    container_name: monopoly-web
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_PATH: /data/monopoly.sqlite
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${MONOPOLY_PORT:-3000}:3000"
    volumes:
      - monopoly-data:/data

volumes:
  monopoly-data:
